swagger: "2.0"
info:
  title: Library Management API
  description: API для управления книгами, читателями и арендой
  version: "1.0.0"

host: localhost:8080
basePath: /
schemes:
  - http

tags:
  - name: Book
    description: Работа с книгами
  - name: Reader
    description: Работа с читателями
  - name: rentals
    description: Аренда книг

definitions:
  Book:
    type: object
    required:
      - ID
      - title
      - copies
      - author
      - issue
    properties:
      ID:
        type: integer
        example: 1
      title:
        type: string
        example: "The Go Programming Language"
      copies:
        type: integer
        example: 3
      author:
        type: string
        example: "Alan A. Donovan"
      issue:
        type: string
        format: date-time
        example: "2015-10-26T00:00:00Z"

  Reader:
    type: object
    required:
      - ID
      - name
      - phone_number
      - address
      - date_of_birth
    properties:
      ID:
        type: integer
        example: 1
      name:
        type: string
        example: "Alice Johnson"
      phone_number:
        type: string
        example: "+1234567890"
      address:
        type: string
        example: "123 Main St"
      date_of_birth:
        type: string
        format: date-time
        example: "1992-03-15T00:00:00Z"

  BookInUse:
    type: object
    required:
      - book_info
      - date_of_rent
    properties:
      book_info:
        $ref: '#/definitions/Book'
      date_of_rent:
        type: string
        format: date-time
        example: "2025-10-23T14:00:00Z"

  Error:
    type: object
    properties:
      message:
        type: string
      error:
        type: string

paths:
  /books:
    get:
      tags:
        - Book
      summary: Получить все книги
      produces:
        - application/json
      responses:
        200:
          description: Список книг
          schema:
            type: object
            properties:
              books:
                type: array
                items:
                  $ref: '#/definitions/Book'
        500:
          description: Ошибка сервера
          schema:
            $ref: '#/definitions/Error'

  /book/title:
    get:
      tags:
        - Book
      summary: Получить книгу по названию
      parameters:
        - in: body
          name: input
          required: true
          schema:
            type: object
            required:
              - title
            properties:
              title:
                type: string
      produces:
        - application/json
      responses:
        200:
          description: Книга найдена
          schema:
            type: object
            properties:
              book:
                $ref: '#/definitions/Book'
        404:
          description: Книга не найдена
          schema:
            $ref: '#/definitions/Error'

  /book/id/title:
    get:
      tags:
        - Book
      summary: Получить ID книги по названию
      parameters:
        - in: body
          name: input
          required: true
          schema:
            type: object
            required:
              - title
            properties:
              title:
                type: string
      produces:
        - application/json
      responses:
        200:
          description: ID книги найден
          schema:
            type: object
            properties:
              id:
                type: integer
        404:
          description: Книга не найдена
          schema:
            $ref: '#/definitions/Error'

  /book/id:
    get:
      tags:
        - Book
      summary: Получить книгу по ID
      parameters:
        - in: body
          name: input
          required: true
          schema:
            type: object
            required:
              - id
            properties:
              id:
                type: integer
      produces:
        - application/json
      responses:
        200:
          description: Книга найдена
          schema:
            type: object
            properties:
              book:
                $ref: '#/definitions/Book'
        404:
          description: Книга не найдена
          schema:
            $ref: '#/definitions/Error'

  /book:
    post:
      tags:
        - Book
      summary: Создать новую книгу
      parameters:
        - in: body
          name: book
          required: true
          schema:
            $ref: '#/definitions/Book'
      produces:
        - application/json
      responses:
        201:
          description: Книга создана
          schema:
            type: object
            properties:
              message:
                type: string
        400:
          description: Ошибка валидации
          schema:
            $ref: '#/definitions/Error'

    delete:
      tags:
        - Book
      summary: Удалить книгу по ID
      parameters:
        - in: body
          name: input
          required: true
          schema:
            type: object
            required:
              - id
            properties:
              id:
                type: integer
      produces:
        - application/json
      responses:
        200:
          description: Книга удалена
          schema:
            type: object
            properties:
              message:
                type: string
        400:
          description: Ошибка
          schema:
            $ref: '#/definitions/Error'

  /book/check/id:
    post:
      tags:
        - Book
      summary: Проверить наличие копий книги по ID
      parameters:
        - in: body
          name: input
          required: true
          schema:
            type: object
            required:
              - id
            properties:
              id:
                type: integer
      produces:
        - application/json
      responses:
        200:
          description: Копии доступны
          schema:
            type: object
            properties:
              message:
                type: string
        409:
          description: Копий нет
          schema:
            $ref: '#/definitions/Error'

  /book/minus:
    patch:
      tags:
        - Book
      summary: Уменьшить количество копий книги по ID
      parameters:
        - in: body
          name: input
          required: true
          schema:
            type: object
            required:
              - id
            properties:
              id:
                type: integer
      produces:
        - application/json
      responses:
        200:
          description: Количество уменьшено
          schema:
            type: object
            properties:
              message:
                type: string
        400:
          description: Ошибка
          schema:
            $ref: '#/definitions/Error'

  /book/plus:
    patch:
      tags:
        - Book
      summary: Увеличить количество копий книги по ID
      parameters:
        - in: body
          name: input
          required: true
          schema:
            type: object
            required:
              - id
            properties:
              id:
                type: integer
      produces:
        - application/json
      responses:
        200:
          description: Количество увеличено
          schema:
            type: object
            properties:
              message:
                type: string
        400:
          description: Ошибка
          schema:
            $ref: '#/definitions/Error'

  /reader/books:
    get:
      tags:
        - Reader
      summary: Получить книги читателя (разделенные по статусу)
      parameters:
        - in: query
          name: name
          required: true
          type: string
      produces:
        - application/json
      responses:
        200:
          description: Список книг по статусу
          schema:
            type: object
            properties:
              okbooks:
                type: array
                items:
                  $ref: '#/definitions/BookInUse'
              badbooks:
                type: array
                items:
                  $ref: '#/definitions/BookInUse'
        500:
          description: Ошибка
          schema:
            $ref: '#/definitions/Error'

  /reader/book:
    post:
      tags:
        - rentals
      summary: Создать запись об арендованной книге
      parameters:
        - in: body
          name: input
          required: true
          schema:
            type: object
            required:
              - book_id
              - reader_id
            properties:
              book_id:
                type: integer
              reader_id:
                type: integer
      produces:
        - application/json
      responses:
        201:
          description: Запись создана
          schema:
            type: object
            properties:
              message:
                type: string
        400:
          description: Ошибка
          schema:
            $ref: '#/definitions/Error'

    get:
      tags:
        - rentals
      summary: Получить все арендованные книги
      produces:
        - application/json
      responses:
        200:
          description: Список арендованных книг
          schema:
            type: object
            properties:
              books_in_use:
                type: array
                items:
                  $ref: '#/definitions/BookInUse'
        500:
          description: Ошибка
          schema:
            $ref: '#/definitions/Error'

    delete:
      tags:
        - rentals
      summary: Удалить запись об аренде
      parameters:
        - in: body
          name: input
          required: true
          schema:
            type: object
            required:
              - reader_id
              - book_id
            properties:
              reader_id:
                type: integer
              book_id:
                type: integer
      produces:
        - application/json
      responses:
        200:
          description: Запись удалена
          schema:
            type: object
            properties:
              message:
                type: string
        400:
          description: Ошибка
          schema:
            $ref: '#/definitions/Error'

  /reader/book/count:
    get:
      tags:
        - rentals
      summary: Количество книг у читателя
      parameters:
        - in: query
          name: reader_id
          required: true
          type: integer
      produces:
        - application/json
      responses:
        200:
          description: Количество книг
          schema:
            type: object
            properties:
              count:
                type: integer
        400:
          description: Ошибка
          schema:
            $ref: '#/definitions/Error'

  /reader/book/id:
    get:
      tags:
        - rentals
      summary: Получить книги читателя по ID
      parameters:
        - in: query
          name: reader_id
          required: true
          type: integer
      produces:
        - application/json
      responses:
        200:
          description: Список арендованных книг читателя
          schema:
            type: object
            properties:
              books_in_use:
                type: array
                items:
                  $ref: '#/definitions/BookInUse'
        400:
          description: Ошибка
          schema:
            $ref: '#/definitions/Error'

  /reader/id/book:
    get:
      tags:
        - Reader
      summary: Получить список ID читателей арендующих книгу
      parameters:
        - in: query
          name: book_id
          required: true
          type: integer
      produces:
        - application/json
      responses:
        200:
          description: Список ID читателей
          schema:
            type: object
            properties:
              reader_ids:
                type: array
                items:
                  type: integer
        400:
          description: Ошибка
          schema:
            $ref: '#/definitions/Error'

  /rent:
    patch:
      tags:
        - rentals
      summary: Взять книгу в аренду (по названию и имени читателя)
      parameters:
        - in: body
          name: input
          required: true
          schema:
            type: object
            required:
              - name
              - title
            properties:
              name:
                type: string
              title:
                type: string
      produces:
        - application/json
      responses:
        200:
          description: Книга арендована
          schema:
            type: object
            properties:
              message:
                type: string
        400:
          description: Ошибка
          schema:
            $ref: '#/definitions/Error'

  /return:
    patch:
      tags:
        - rentals
      summary: Вернуть книгу (по названию и имени читателя)
      parameters:
        - in: body
          name: input
          required: true
          schema:
            type: object
            required:
              - name
              - title
            properties:
              name:
                type: string
              title:
                type: string
      produces:
        - application/json
      responses:
        200:
          description: Книга возвращена
          schema:
            type: object
            properties:
              message:
                type: string
        400:
          description: Ошибка
          schema:
            $ref: '#/definitions/Error'

  /readers:
    get:
      tags:
        - Reader
      summary: Получить всех читателей
      produces:
        - application/json
      responses:
        200:
          description: Список читателей
          schema:
            type: object
            properties:
              readers:
                type: array
                items:
                  $ref: '#/definitions/Reader'
        500:
          description: Ошибка сервера
          schema:
            $ref: '#/definitions/Error'

  /reader/id:
    get:
      tags:
        - Reader
      summary: Получить ID читателя по имени
      parameters:
        - in: query
          name: name
          required: true
          type: string
      produces:
        - application/json
      responses:
        200:
          description: ID читателя найден
          schema:
            type: object
            properties:
              id:
                type: integer
        404:
          description: Читатель не найден
          schema:
            $ref: '#/definitions/Error'

  /reader:
    post:
      tags:
        - Reader
      summary: Создать нового читателя
      parameters:
        - in: body
          name: reader
          required: true
          schema:
            $ref: '#/definitions/Reader'
      produces:
        - application/json
      responses:
        201:
          description: Читатель создан
          schema:
            type: object
            properties:
              message:
                type: string
        400:
          description: Ошибка валидации
          schema:
            $ref: '#/definitions/Error'

    delete:
      tags:
        - Reader
      summary: Удалить читателя по ID
      parameters:
        - in: body
          name: input
          required: true
          schema:
            type: object
            required:
              - reader_id
            properties:
              reader_id:
                type: integer
      produces:
        - application/json
      responses:
        200:
          description: Читатель удалён
          schema:
            type: object
            properties:
              message:
                type: string
        400:
          description: Ошибка
          schema:
            $ref: '#/definitions/Error'

  /reader/contact:
    patch:
      tags:
        - Reader
      summary: Обновить контактные данные читателя
      parameters:
        - in: body
          name: input
          required: true
          schema:
            type: object
            required:
              - reader_id
              - phone_number
              - address
            properties:
              reader_id:
                type: integer
              phone_number:
                type: string
              address:
                type: string
      produces:
        - application/json
      responses:
        200:
          description: Контакты обновлены
          schema:
            type: object
            properties:
              message:
                type: string
        400:
          description: Ошибка
          schema:
            $ref: '#/definitions/Error'
